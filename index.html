<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Invoice App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">My Invoice App</div>
    <button id="language" class="language" data-i18n-title="changeLanguage">🌐 <span data-i18n="languageName">English</span></button>
  </header>

  <main>
    <div class="title">
      <h1 data-i18n="newInvoice">New invoice</h1>
      <span id="invoice-number" class="invoice-number"></span>
    </div>

    <p id="copy-note" class="copy-note" hidden>
      <span id="copy-of"></span>
      <button id="cancel-copy" type="button" data-i18n="cancel">Cancel</button>
    </p>

    <form id="invoice-form" class="card">
      <label>
        <span data-i18n="client">Client</span>
        <input id="client" type="text" data-i18n-placeholder="clientPlaceholder" placeholder="Client name" autocomplete="off">
      </label>

      <div class="row">
        <label>
          <span data-i18n="date">Date</span>
          <input id="date" type="date">
        </label>
        <label>
          <span data-i18n="dueDate">Due date</span>
          <input id="due-date" type="date">
        </label>
      </div>

      <div class="row">
        <label>
          <span data-i18n="currency">Currency</span>
          <select id="currency">
            <option value="KM">KM</option>
            <option value="EUR">EUR</option>
          </select>
        </label>
      </div>

      <h2 data-i18n="lines">Lines</h2>
      <div id="lines"></div>
      <p id="no-lines" class="empty" data-i18n="noLines" hidden></p>
      <button id="add-line" type="button" class="secondary" data-i18n="addLine">+ Add line</button>

      <dl class="totals">
        <div>
          <dt data-i18n="withoutVat">Amount without VAT</dt>
          <dd id="subtotal"></dd>
        </div>
        <div>
          <dt data-i18n="vat">VAT 17%</dt>
          <dd id="vat"></dd>
        </div>
        <div class="grand-total">
          <dt data-i18n="total">Total</dt>
          <dd id="total"></dd>
        </div>
      </dl>

      <button id="save" type="button" class="primary" data-i18n="save">Save</button>
      <p id="save-message" role="status" hidden></p>
    </form>

    <section class="invoices">
      <h1 id="invoices-title"></h1>
      <ul id="invoice-list" class="invoice-list"></ul>
      <p id="no-invoices" class="empty" data-i18n="noInvoices" hidden></p>
    </section>

    <details class="settings card">
      <summary data-i18n="settings">Settings</summary>
      <label>
        <span data-i18n="euroSymbol">Show euros as</span>
        <select id="euro-symbol">
          <option value="EUR">1.250,00 EUR</option>
          <option value="€">1.250,00 €</option>
        </select>
      </label>
    </details>
  </main>

  <template id="invoice-row-template">
    <li class="invoice-row">
      <span class="row-number"></span>
      <span class="row-client"></span>
      <span class="row-date"></span>
      <span class="row-due"></span>
      <span class="row-total"></span>
      <span class="row-actions">
        <button type="button" class="duplicate link"></button>
      </span>
    </li>
  </template>

  <template id="line-template">
    <div class="line">
      <label class="line-description">
        <span data-i18n="description">Description</span>
        <input class="description" type="text" data-i18n-placeholder="descriptionPlaceholder" autocomplete="off">
      </label>
      <label>
        <span data-i18n="quantity">Quantity</span>
        <input class="quantity" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <label>
        <span data-i18n="price">Price</span>
        <input class="price" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <div class="line-amount">
        <span data-i18n="amount">Amount</span>
        <output class="amount"></output>
      </div>
      <button type="button" class="remove" data-i18n-title="removeLine" data-i18n-label="removeLine">✕</button>
      <p class="line-error error" hidden></p>
    </div>
  </template>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
