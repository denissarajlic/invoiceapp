<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Invoice App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">My Invoice App</div>
    <button id="language" class="language" data-i18n-title="changeLanguage">🌐 <span data-i18n="languageName">English</span></button>
  </header>

  <main>
    <div class="title">
      <h1 id="form-title">New invoice</h1>
      <span id="invoice-number" class="invoice-number"></span>
    </div>

    <p id="form-note" class="form-note" hidden>
      <span id="form-note-text"></span>
      <button id="cancel-form" type="button" data-i18n="cancel">Cancel</button>
    </p>

    <form id="invoice-form" class="card">
      <label>
        <span data-i18n="client">Client</span>
        <input id="client" type="text" list="client-options" data-i18n-placeholder="clientPlaceholder" placeholder="Client name" autocomplete="off">
        <datalist id="client-options"></datalist>
      </label>

      <div class="row">
        <label>
          <span data-i18n="address">Address</span>
          <input id="client-address" type="text" autocomplete="off">
        </label>
        <label>
          <span data-i18n="jib">ID number (JIB)</span>
          <input id="client-jib" type="text" inputmode="numeric" autocomplete="off">
        </label>
      </div>

      <div class="row">
        <label>
          <span data-i18n="date">Date</span>
          <input id="date" type="date">
        </label>
        <label>
          <span data-i18n="dueDate">Due date</span>
          <input id="due-date" type="date">
        </label>
      </div>

      <div class="row">
        <label>
          <span data-i18n="currency">Currency</span>
          <select id="currency">
            <option value="KM">KM</option>
            <option value="EUR">EUR</option>
          </select>
        </label>
        <label class="checkbox">
          <input id="paid" type="checkbox">
          <span data-i18n="paid">Paid</span>
        </label>
      </div>

      <h2 data-i18n="lines">Lines</h2>
      <div id="lines"></div>
      <p id="no-lines" class="empty" data-i18n="noLines" hidden></p>
      <button id="add-line" type="button" class="secondary" data-i18n="addLine">+ Add line</button>

      <label class="note-field">
        <span data-i18n="note">Note</span>
        <textarea id="note" rows="2" data-i18n-placeholder="notePlaceholder"></textarea>
      </label>

      <dl class="totals">
        <div>
          <dt data-i18n="withoutVat">Amount without VAT</dt>
          <dd id="subtotal"></dd>
        </div>
        <div>
          <dt data-i18n="vat">VAT 17%</dt>
          <dd id="vat"></dd>
        </div>
        <div class="grand-total">
          <dt data-i18n="total">Total</dt>
          <dd id="total"></dd>
        </div>
      </dl>

      <button id="save" type="button" class="primary" data-i18n="save">Save</button>
      <p id="save-message" role="status" hidden></p>
    </form>

    <section class="invoices">
      <h1 data-i18n="summary">Summary</h1>
      <div class="summary">
        <div class="summary-box">
          <div class="summary-label" data-i18n="thisMonth">This month</div>
          <div id="summary-month" class="summary-amount"></div>
          <div id="summary-month-net" class="summary-net"></div>
        </div>
        <div class="summary-box">
          <div class="summary-label" data-i18n="thisYear">This year</div>
          <div id="summary-year" class="summary-amount"></div>
          <div id="summary-year-net" class="summary-net"></div>
        </div>
        <div class="summary-box">
          <div class="summary-label" data-i18n="unpaid">Unpaid</div>
          <div id="summary-unpaid" class="summary-amount"></div>
        </div>
        <div id="summary-overdue-box" class="summary-box">
          <div class="summary-label" data-i18n="overdue">Overdue</div>
          <div id="summary-overdue" class="summary-amount"></div>
        </div>
      </div>

      <h1 id="invoices-title"></h1>

      <div class="list-tools">
        <label class="month-filter">
          <span data-i18n="show">Show</span>
          <select id="month-filter"></select>
        </label>
        <button id="export" type="button" class="tool-button" data-i18n="exportCsv">⬇ Export (CSV)</button>
      </div>

      <dl id="month-totals" class="month-totals" hidden>
        <div>
          <dt data-i18n="withoutVat">Amount without VAT</dt>
          <dd id="month-subtotal"></dd>
        </div>
        <div>
          <dt data-i18n="vat">VAT 17%</dt>
          <dd id="month-vat"></dd>
        </div>
        <div class="grand-total">
          <dt data-i18n="total">Total</dt>
          <dd id="month-total"></dd>
        </div>
      </dl>

      <ul id="invoice-list" class="invoice-list"></ul>
      <p id="no-invoices" class="empty" data-i18n="noInvoices" hidden></p>
    </section>

    <details class="clients card">
      <summary id="clients-title">Clients</summary>
      <ul id="client-list" class="client-list"></ul>
      <p id="no-clients" class="empty" data-i18n="noClients" hidden></p>
    </details>

    <details class="settings card">
      <summary data-i18n="settings">Settings</summary>

      <h2 data-i18n="yourBusiness">Your business</h2>
      <p class="hint" data-i18n="yourBusinessHint"></p>
      <label>
        <span data-i18n="businessName">Business name</span>
        <input id="business-name" type="text" autocomplete="organization">
      </label>
      <label>
        <span data-i18n="address">Address</span>
        <input id="business-address" type="text" autocomplete="street-address">
      </label>
      <div class="row">
        <label>
          <span data-i18n="jib">ID number (JIB)</span>
          <input id="business-jib" type="text" inputmode="numeric" autocomplete="off">
        </label>
        <label>
          <span data-i18n="bankAccount">Bank account</span>
          <input id="business-bank" type="text" autocomplete="off">
        </label>
      </div>
      <p id="business-saved" class="hint"></p>

      <h2 data-i18n="display">Display</h2>
      <label>
        <span data-i18n="euroSymbol">Show euros as</span>
        <select id="euro-symbol">
          <option value="EUR">1.250,00 EUR</option>
          <option value="€">1.250,00 €</option>
        </select>
      </label>
    </details>
  </main>

  <template id="invoice-row-template">
    <li class="invoice-row">
      <span class="row-number"></span>
      <span class="row-client"></span>
      <span class="row-date"></span>
      <span class="row-due"></span>
      <span class="row-total"></span>
      <span class="row-actions">
        <span class="status"></span>
        <button type="button" class="toggle-paid link"></button>
        <button type="button" class="print link"></button>
        <button type="button" class="edit link"></button>
        <button type="button" class="duplicate link"></button>
        <button type="button" class="delete link danger"></button>
      </span>
    </li>
  </template>

  <template id="line-template">
    <div class="line">
      <label class="line-description">
        <span data-i18n="description">Description</span>
        <input class="description" type="text" data-i18n-placeholder="descriptionPlaceholder" autocomplete="off">
      </label>
      <label>
        <span data-i18n="quantity">Quantity</span>
        <input class="quantity" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <label>
        <span data-i18n="price">Price</span>
        <input class="price" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <div class="line-amount">
        <span data-i18n="amount">Amount</span>
        <output class="amount"></output>
      </div>
      <button type="button" class="remove" data-i18n-title="removeLine" data-i18n-label="removeLine">✕</button>
      <p class="line-error error" hidden></p>
    </div>
  </template>

  <!-- Only shown when printing. Filled in by print.js. -->
  <article id="print-area" class="print-area"></article>

  <template id="client-row-template">
    <li class="client-row">
      <div>
        <div class="client-name"></div>
        <div class="client-details"></div>
      </div>
      <span class="row-actions">
        <button type="button" class="edit link"></button>
        <button type="button" class="delete link danger"></button>
      </span>
    </li>
  </template>

  <template id="client-edit-template">
    <li class="client-row client-edit">
      <label>
        <span data-i18n="client">Client</span>
        <input class="client-name-input" type="text" autocomplete="off">
      </label>
      <label>
        <span data-i18n="address">Address</span>
        <input class="client-address-input" type="text" autocomplete="off">
      </label>
      <label>
        <span data-i18n="jib">ID number (JIB)</span>
        <input class="client-jib-input" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <p class="error" hidden></p>
      <span class="row-actions">
        <button type="button" class="cancel-client link" data-i18n="cancel">Cancel</button>
        <button type="button" class="save-client small-primary" data-i18n="save">Save</button>
      </span>
    </li>
  </template>

  <script src="i18n.js"></script>
  <script src="clients.js"></script>
  <script src="print.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
